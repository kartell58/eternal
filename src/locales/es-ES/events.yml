      incorrect: ❌ Código incorrecto, inténtalo de nuevo.
    expired:
      title: Desafío expirado
      body: Este CAPTCHA ha expirado. Haz clic en **Responder** en el panel de verificación para intentarlo de nuevo.
    failed:
      title: Verificación fallida
      body: Has usado los {{maxAttempts}} intentos. Haz clic en **Responder** en el panel de verificación para obtener un nuevo código.
    success:
      title: ¡Verificado!
    issue:
      title: Problema de verificación
    errors:
      guild_only: Esta acción solo se puede usar dentro de un servidor.
